name: Build 3DS (NovaGL)

on:
  push:
    branches: [ main, master, feature/3ds-*, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-3ds-novagl:
    name: Build 3DS with NovaGL
    runs-on: ubuntu-latest
    
    container:
      image: devkitpro/devkitarm:latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    
    - name: Update pacman mirrors
      run: |
        echo "🔧 Fixing devkitPro mirror..."
        # Update mirrorlist to use wii.leseratte10.de instead of pkg.devkitpro.org
        sed -i 's|pkg.devkitpro.org|wii.leseratte10.de/devkitpro|g' /etc/pacman.d/mirrorlist
        cat /etc/pacman.d/mirrorlist
    
    - name: Install dependencies
      run: |
        dkp-pacman -Syu --noconfirm
        dkp-pacman -S --noconfirm 3ds-dev 3dstools
        apt-get update && apt-get install -y imagemagick git wget curl
    
    - name: Download game data files
      env:
        WACKI_EXE_URL: ${{ secrets.WACKI_EXE_URL }}
      run: |
        if [ -z "$WACKI_EXE_URL" ]; then
          echo "✗ ERROR: WACKI_EXE_URL secret not set!"
          echo "This build requires original game files."
          exit 1
        fi
        
        echo "📦 Downloading WACKI.EXE from secret URL..."
        mkdir -p data
        
        # Try wget first, then curl
        if command -v wget &> /dev/null; then
          wget --no-check-certificate -q -O data/WACKI.EXE "$WACKI_EXE_URL" || {
            echo "✗ wget failed, trying curl..."
            curl -k -L -s -o data/WACKI.EXE "$WACKI_EXE_URL" || {
              echo "✗ Failed to download WACKI.EXE"
              exit 1
            }
          }
        else
          curl -k -L -s -o data/WACKI.EXE "$WACKI_EXE_URL" || {
            echo "✗ Failed to download WACKI.EXE"
            exit 1
          }
        fi
        
        # Verify it's a real PE file (starts with MZ)
        if ! head -c 2 data/WACKI.EXE | grep -q "MZ"; then
          echo "✗ Downloaded file is not a valid PE executable!"
          echo "File contents (first 100 bytes):"
          head -c 100 data/WACKI.EXE | od -A x -t x1z
          exit 1
        fi
        
        echo "✓ WACKI.EXE downloaded successfully"
        ls -lh data/WACKI.EXE
    
    - name: Download NovaGL
      run: |
        echo "📦 Cloning NovaGL..."
        git clone --depth=1 https://github.com/efimandreev0/NovaGL.git external/NovaGL
        echo "✓ NovaGL downloaded"
    
    - name: Fix NovaGL CMakeLists.txt
      run: |
        cd external/NovaGL/src
        echo "🔧 Patching CMakeLists.txt (removing gas.c)..."
        sed -i '/gas.c/d' CMakeLists.txt
        echo "✓ CMakeLists.txt patched"
        cd ../../..
    
    - name: Build NovaGL
      run: |
        cd external/NovaGL
        echo "🔨 Building NovaGL with CMake..."
        
        mkdir -p build && cd build
        cmake -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/3DS.cmake \
              -DCMAKE_BUILD_TYPE=Release \
              -DGL2CITRO3D_BUILD_EXAMPLES=OFF \
              ..
        make -j$(nproc) || {
          echo "✗ NovaGL build failed"
          exit 1
        }
        
        cd ..
        echo "✓ NovaGL built successfully"
        
        # Organize library
        mkdir -p lib
        if [ -f "build/src/libNovaGL.a" ]; then
          cp build/src/libNovaGL.a lib/
          echo "  ✓ Copied lib/libNovaGL.a"
        elif [ -f "build/libNovaGL.a" ]; then
          cp build/libNovaGL.a lib/
          echo "  ✓ Copied lib/libNovaGL.a"
        else
          echo "✗ ERROR: libNovaGL.a not found!"
          find build -name "*.a"
          exit 1
        fi
        
        ls -la lib/
        cd ../..
    
    - name: Build Wacki
      run: |
        export DEVKITPRO=/opt/devkitpro
        export DEVKITARM=$DEVKITPRO/devkitARM
        echo "🔨 Building Wacki for 3DS..."
        make TARGET=3ds clean || true
        make TARGET=3ds -j$(nproc) || {
          echo "✗ Wacki build failed"
          exit 1
        }
        echo "✓ Wacki built successfully"
    
    - name: Create 3DSX
      run: |
        echo "📦 Creating .3dsx file..."
        3dsxtool dist/wacki dist/wacki.3dsx
        ls -lh dist/wacki.3dsx
        echo "✓ Created wacki.3dsx"
    
    - name: Create icon and SMDH
      run: |
        if [ -f "assets/icons/wacki.png" ]; then
          echo "🎨 Creating icon..."
          convert assets/icons/wacki.png -resize 48x48! assets/icons/wacki-48.png
          
          if command -v smdhtool &> /dev/null; then
            smdhtool --create "Wacki" \
              "Point-and-click adventure" \
              "szczuru" \
              assets/icons/wacki-48.png \
              dist/wacki.smdh
            echo "✓ Created wacki.smdh"
            ls -lh dist/wacki.smdh
          fi
        else
          echo "⚠️  Icon not found at assets/icons/wacki.png"
        fi
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wacki-3ds-novagl
        path: |
          dist/wacki.3dsx
          dist/wacki.smdh
        retention-days: 30
    
    - name: Build summary
      run: |
        echo "========================================="
        echo "  ✓ Build Complete!"
        echo "========================================="
        if [ -f "dist/wacki.3dsx" ]; then
          SIZE=$(du -h dist/wacki.3dsx | cut -f1)
          echo "  📦 wacki.3dsx: $SIZE"
        fi
        if [ -f "dist/wacki.smdh" ]; then
          SIZE=$(du -h dist/wacki.smdh | cut -f1)
          echo "  🎨 wacki.smdh: $SIZE"
        fi
        echo ""
        echo "Download from Actions → Artifacts"
        echo "========================================="
