name: Build 3DS (NovaGL)

on:
  push:
    branches: [ main, master, feature/3ds-*, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-3ds-novagl:
    name: Build 3DS with NovaGL
    runs-on: ubuntu-latest
    
    container:
      image: devkitpro/devkitarm:latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1
    
    - name: Install dependencies
      run: |
        dkp-pacman -Syu --noconfirm
        dkp-pacman -S --noconfirm \
          3ds-dev \
          3ds-cmake \
          3dstools
        apt-get update && apt-get install -y imagemagick cmake
    
    - name: Verify NovaGL submodule
      run: |
        if [ ! -d "external/NovaGL" ]; then
          echo "ERROR: NovaGL submodule not found"
          exit 1
        fi
        echo "✓ NovaGL found"
    
    - name: Build NovaGL
      run: |
        cd external/NovaGL
        mkdir -p build && cd build
        cmake -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/3DS.cmake \
              -DCMAKE_BUILD_TYPE=Release \
              ..
        make -j$(nproc)
        cd ..
        mkdir -p lib
        cp build/libNovaGL.a lib/ || echo "WARNING: libNovaGL.a not found"
        cd ../..
    
    - name: Build Wacki
      run: |
        export DEVKITPRO=/opt/devkitpro
        export DEVKITARM=$DEVKITPRO/devkitARM
        make TARGET=3ds clean
        make TARGET=3ds -j$(nproc)
    
    - name: Create 3DSX
      run: |
        3dsxtool dist/wacki dist/wacki.3dsx
        echo "✓ Created wacki.3dsx"
    
    - name: Create icon and SMDH
      run: |
        if [ -f "assets/icons/wacki.png" ]; then
          convert assets/icons/wacki.png -resize 48x48! assets/icons/wacki-48.png
          if command -v smdhtool &> /dev/null; then
            smdhtool --create "Wacki" \
              "Point-and-click (NovaGL)" \
              "szczuru" \
              assets/icons/wacki-48.png \
              dist/wacki.smdh
          fi
        fi
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wacki-3ds-novagl
        path: |
          dist/wacki.3dsx
          dist/wacki.smdh
        retention-days: 30
