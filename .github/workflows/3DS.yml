name: Build 3DS (NovaGL)

on:
  push:
    branches: [ main, master, test-3ds, feature/3ds-*, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-3ds-novagl:
    name: Build 3DS with NovaGL
    runs-on: ubuntu-latest
    
    container:
      image: devkitpro/devkitarm:latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    
    - name: Fix devkitPro repositories
      run: |
        echo "🔧 Fixing devkitPro package repositories..."
        if [ -f "/etc/pacman.conf" ]; then
          sed -i 's|https://pkg.devkitpro.org|https://wii.leseratte10.de/devkitpro|g' /etc/pacman.conf
          sed -i 's|http://pkg.devkitpro.org|https://wii.leseratte10.de/devkitpro|g' /etc/pacman.conf
        fi
    
    - name: Install dependencies
      run: |
        dkp-pacman -Sy --noconfirm || echo "⚠️  Database sync failed"
        dkp-pacman -S --noconfirm 3ds-dev 3dstools --overwrite='*'
        apt-get update && apt-get install -y imagemagick git wget curl
        echo "✓ Dependencies installed"
    
    - name: Create SDL stub header for 3DS
      run: |
        echo "🔧 Creating minimal SDL.h stub for 3DS build..."
        mkdir -p include/SDL_stub
        cat > include/SDL_stub/SDL.h << 'EOF'
/* Minimal SDL.h stub for 3DS build - NovaGL provides rendering */
#ifndef SDL_STUB_H
#define SDL_STUB_H

#include <stdint.h>

/* Minimal types that Wacki sources reference */
typedef struct SDL_Surface SDL_Surface;
typedef struct SDL_Rect {
    int16_t x, y;
    uint16_t w, h;
} SDL_Rect;

/* Dummy defines */
#define SDL_INIT_VIDEO 0
#define SDL_INIT_AUDIO 0
#define SDL_SWSURFACE 0
#define SDL_SRCALPHA 0

/* Stub functions - implemented in platform layer */
static inline int SDL_Init(uint32_t flags) { (void)flags; return 0; }
static inline void SDL_Quit(void) {}

#endif /* SDL_STUB_H */
EOF
        echo "✓ SDL stub created at include/SDL_stub/SDL.h"
    
    - name: Download game data files
      env:
        WACKI_EXE_URL: ${{ secrets.WACKI_EXE_URL }}
      run: |
        if [ -z "$WACKI_EXE_URL" ]; then
          echo "✗ ERROR: WACKI_EXE_URL secret not set!"
          exit 1
        fi
        
        echo "📦 Downloading WACKI.EXE..."
        mkdir -p data
        
        if command -v wget &> /dev/null; then
          wget --no-check-certificate -q -O data/WACKI.EXE "$WACKI_EXE_URL" || \
            curl -k -L -s -o data/WACKI.EXE "$WACKI_EXE_URL"
        else
          curl -k -L -s -o data/WACKI.EXE "$WACKI_EXE_URL"
        fi
        
        if ! head -c 2 data/WACKI.EXE | grep -q "MZ"; then
          echo "✗ Downloaded file is not a valid PE executable!"
          exit 1
        fi
        
        echo "✓ WACKI.EXE downloaded"
        ls -lh data/WACKI.EXE
    
    - name: Download NovaGL
      run: |
        echo "📦 Cloning NovaGL..."
        git clone --depth=1 https://github.com/efimandreev0/NovaGL.git external/NovaGL
        echo "✓ NovaGL downloaded"
    
    - name: Fix NovaGL CMakeLists.txt
      run: |
        cd external/NovaGL/src
        echo "🔧 Patching CMakeLists.txt (removing gas.c)..."
        sed -i '/gas.c/d' CMakeLists.txt
        cd ../../..
    
    - name: Build NovaGL
      run: |
        cd external/NovaGL
        echo "🔨 Building NovaGL..."
        
        mkdir -p build && cd build
        cmake -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/3DS.cmake \
              -DCMAKE_BUILD_TYPE=Release \
              -DGL2CITRO3D_BUILD_EXAMPLES=OFF \
              ..
        make -j$(nproc)
        cd ..
        
        mkdir -p lib
        if [ -f "build/src/libNovaGL.a" ]; then
          cp build/src/libNovaGL.a lib/
        elif [ -f "build/libNovaGL.a" ]; then
          cp build/libNovaGL.a lib/
        else
          echo "✗ ERROR: libNovaGL.a not found!"
          find build -name "*.a"
          exit 1
        fi
        
        echo "✓ NovaGL built"
        cd ../..
    
    - name: Update mk/3ds.mk with SDL stub path
      run: |
        echo "🔧 Updating mk/3ds.mk to use SDL stub..."
        sed -i 's|SDL_CFG := -I$(DEVKITPRO)/portlibs/3ds/include|SDL_CFG := -I$(PWD)/include/SDL_stub|g' mk/3ds.mk
        echo "✓ mk/3ds.mk updated"
        cat mk/3ds.mk
    
    - name: Build Wacki
      run: |
        export DEVKITPRO=/opt/devkitpro
        export DEVKITARM=$DEVKITPRO/devkitARM
        echo "🔨 Building Wacki for 3DS..."
        make TARGET=3ds clean || true
        make TARGET=3ds -j$(nproc) || {
          echo "✗ Wacki build failed"
          exit 1
        }
        echo "✓ Wacki built successfully"
    
    - name: Create 3DSX
      run: |
        echo "📦 Creating .3dsx..."
        3dsxtool dist/wacki dist/wacki.3dsx
        ls -lh dist/wacki.3dsx
    
    - name: Create icon and SMDH
      run: |
        if [ -f "assets/icons/wacki.png" ]; then
          convert assets/icons/wacki.png -resize 48x48! assets/icons/wacki-48.png
          if command -v smdhtool &> /dev/null; then
            smdhtool --create "Wacki" \
              "Point-and-click adventure" \
              "szczuru" \
              assets/icons/wacki-48.png \
              dist/wacki.smdh
            echo "✓ Created wacki.smdh"
          fi
        fi
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wacki-3ds-novagl
        path: |
          dist/wacki.3dsx
          dist/wacki.smdh
        retention-days: 30
    
    - name: Build summary
      run: |
        echo "========================================="
        echo "  ✓ Build Complete!"
        echo "========================================="
        if [ -f "dist/wacki.3dsx" ]; then
          SIZE=$(du -h dist/wacki.3dsx | cut -f1)
          echo "  📦 wacki.3dsx: $SIZE"
        fi
        if [ -f "dist/wacki.smdh" ]; then
          SIZE=$(du -h dist/wacki.smdh | cut -f1)
          echo "  🎨 wacki.smdh: $SIZE"
        fi
        echo "========================================="
