name: 3DS build

on:
  workflow_dispatch:
  push:
    branches: [ 3ds-ai ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'Makefile'
      - 'mk/**'
      - 'tools/**'
      - 'assets/**'
      - '.github/workflows/3DS.yml'

jobs:
  build-3ds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Przywroc WACKI.EXE z sekretu (opcjonalne)
        env:
          WACKI_EXE_URL: ${{ secrets.WACKI_EXE_URL }}
        run: |
          if [ -n "$WACKI_EXE_URL" ]; then
            mkdir -p data
            curl -fsSL "$WACKI_EXE_URL" -o data/WACKI.EXE
            echo "WACKI.EXE pobrano z URL ($(wc -c < data/WACKI.EXE) bajtow)"
          else
            echo "Brak sekretu WACKI_EXE_URL - build uzyje dynamicznego ladowania z karty SD"
          fi

      - name: Build (tools/build-3ds.sh)
        run: bash tools/build-3ds.sh

      - name: Wgraj artefakt .3dsx
        uses: actions/upload-artifact@v4
        with:
          name: wacki-3ds
          path: dist/wacki.3dsx
          if-no-files-found: error

      # tools/build-3ds.sh's `docker run` has no --user flag, so the build
      # inside the devkitpro/devkitarm container runs as root; since dist/
      # is a bind-mounted host directory (-v "$PWD:/wacki"), every file it
      # creates there (dist/wacki, dist/wacki.3dsx, dist/wacki.smdh) ends up
      # OWNED BY ROOT on the runner's own filesystem too. The next step
      # runs as the normal unprivileged `runner` user directly on the
      # runner host (see its own comment for why), which can't write into
      # a root-owned dist/ -- exactly the "mkdir: cannot create directory
      # 'dist/cia-work': Permission denied" failure hit on the first CI
      # run of this workflow. Reclaiming ownership here (rather than
      # adding --user to the docker run call) avoids any risk of that
      # flag breaking the container's own `make install` step, which
      # writes into /opt/devkitpro and may expect to run as root.
      - name: Popraw wlasciciela dist/ (po buildzie w kontenerze jako root)
        run: sudo chown -R "$(id -u):$(id -g)" dist/

      # Runs on the GHA runner HOST (ubuntu-latest = Ubuntu 24.04, glibc
      # 2.39), NOT inside the devkitpro/devkitarm container above — makerom
      # and bannertool's prebuilt Linux binaries require glibc >= 2.38,
      # which the devkitarm image's older Debian base does not provide.
      # tools/build-3ds.sh already produced dist/wacki (the ELF) and
      # dist/wacki.3dsx in the previous step; this step only PACKAGES that
      # ELF into an installable .cia, no engine recompilation happens here.
      - name: Build CIA (tools/build-3ds-cia.sh)
        run: bash tools/build-3ds-cia.sh

      - name: Wgraj artefakt .cia
        uses: actions/upload-artifact@v4
        with:
          name: wacki-3ds-cia
          path: dist/wacki.cia
          if-no-files-found: error
